services:
  ai-server:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 서버 .env 값이 비어 있어도 운영 Spring 콜백을 활성화한다.
      SPRING_CALLBACK_URL: "${SPRING_CALLBACK_URL:-https://oneexpo.kro.kr/api/v1/feedbackDetail/results}"
    restart: unless-stopped
    volumes:
      - ./weights:/app/weights
      # 결과 JSONL과 재학습용 이미지/판정 쌍을 컨테이너 재생성 후에도 보존한다.
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "3.0"
