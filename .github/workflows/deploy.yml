name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1단계: 단위 테스트 ──────────────────────────────────────────────────────────
  test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest tests/ -v

  # Pi5 배포는 서버의 ai-autodeploy.timer가 main을 5분마다 확인해 수행한다.
  # GitHub self-hosted runner는 설치되어 있지 않으므로 CI에서는 테스트만 실행한다.
